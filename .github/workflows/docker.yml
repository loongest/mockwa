name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - "packages/**"
      - "examples/**"
      - "e2e/**"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Only a `v*` tag publishes (and only a release moves `latest`). Pull requests and pushes to `main`
# run the same build, smoke checks and multi-platform build, then stop before any registry.
env:
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read
  # Required to push to ghcr.io with the automatic GITHUB_TOKEN.
  packages: write
  # Required by actions/attest-build-provenance (signed, verifiable build provenance).
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build, smoke-test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      # arm64 is built under emulation, which keeps the job a single runner and works on any
      # fork regardless of visibility. The build is small and the layer cache below keeps the
      # slow legs off the critical path; splitting onto native `ubuntu-*-arm` runners is a
      # possible speedup, at the cost of a per-arch matrix and a manifest merge.
      - name: Setup QEMU 🖥️
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Setup Buildx 🛠️
        uses: docker/setup-buildx-action@v4

      # GHCR always; Docker Hub joins once both its credentials exist — the repository
      # variable DOCKER_HUB_USERNAME (`gh variable set`) and the secret DOCKER_HUB_TOKEN
      # (`gh secret set`) — so a fork or a fresh clone stays green without them.
      - name: Decide where to publish 🗺️
        id: registries
        run: |
          dockerhub=''
          if [ -n "$DOCKER_HUB_TOKEN" ] && [ -n "$DOCKER_HUB_USERNAME" ]; then
            dockerhub="docker.io/$DOCKER_HUB_USERNAME/$REPO_NAME"
          fi
          {
            echo "dockerhub=$dockerhub"
            echo 'images<<IMAGES'
            echo 'ghcr.io/${{ github.repository }}'
            if [ -n "$dockerhub" ]; then echo "$dockerhub"; fi
            echo 'IMAGES'
          } >> "$GITHUB_OUTPUT"
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}

      # Tags are only pushed from a `v*` tag: the semver ladder (1.2.3 / 1.2 / 1) and `sha-<short>`,
      # with `flavor: latest=auto` (the default) moving `latest` to the released version. An
      # ordinary commit on `main` never touches `latest`.
      - name: Derive tags and labels 🏷️
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # A single-platform build the runner can actually run, so nothing is published before
      # the image has answered a request. Its layers are what the multi-platform build below
      # reuses for linux/amd64.
      # What the image reports as its version (SPEC §5): the release tag without its `v`, or a
      # dev version naming the commit for any other build.
      - name: Derive the version 🔢
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build for the smoke test 🏗️
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mockwa:ci
          build-args: MOCKWA_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The end-to-end checks drive the image from the outside: the example echo app plays the
      # app under test (it verifies every signature and replies through 8888), and Playwright
      # drives the console on 8025. Only their own tooling is installed, never a build.
      - name: Setup Node.js for the end-to-end checks 📦
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Playwright 🎭
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the image and the echo app 🧪
        run: |
          set -euo pipefail
          PORT=3001 APP_SECRET=ci-app-secret VERIFY_TOKEN=ci-verify-token \
            GRAPH_API_BASE_URL=http://127.0.0.1:8888/v25.0 \
            nohup node examples/echo-app/server.mjs > echo-app.log 2>&1 &
          docker run -d --name mockwa-ci \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:8888:8888 -p 127.0.0.1:8025:8025 \
            -e MOCKWA_WEBHOOK_URL=http://host.docker.internal:3001/webhook \
            -e MOCKWA_APP_SECRET=ci-app-secret \
            -e MOCKWA_WEBHOOK_VERIFY_TOKEN=ci-verify-token \
            -e MOCKWA_VERIFY_ON_START=true \
            mockwa:ci
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' mockwa-ci)"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' mockwa-ci)" = "healthy"
          test "$(docker exec mockwa-ci whoami)" = "node"
          reported="$(curl --fail --silent --show-error http://localhost:8025/api/export | jq -r .whalocVersion)"
          test "$reported" = "$MOCKWA_VERSION" || { echo "image reports $reported, expected $MOCKWA_VERSION"; exit 1; }
        env:
          MOCKWA_VERSION: ${{ steps.version.outputs.version }}

      # A second instance for the virtual phone (M1), seeded with its named identities and a
      # quick-reply template, with an echo app of its own so the two suites never share state.
      - name: Start the M1 image and its echo app 🧪
        run: |
          set -euo pipefail
          PORT=3002 APP_SECRET=m1-app-secret VERIFY_TOKEN=m1-verify-token \
            GRAPH_API_BASE_URL=http://127.0.0.1:18888/v25.0 \
            nohup node examples/echo-app/server.mjs > echo-app-m1.log 2>&1 &
          docker run -d --name mockwa-ci-m1 \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:18888:8888 -p 127.0.0.1:18025:8025 \
            -v "$PWD/e2e/fixtures/m1-seed.json:/seed/m1-seed.json:ro" \
            -e MOCKWA_SEED_FILE=/seed/m1-seed.json \
            -e MOCKWA_WEBHOOK_URL=http://host.docker.internal:3002/webhook \
            -e MOCKWA_APP_SECRET=m1-app-secret \
            -e MOCKWA_WEBHOOK_VERIFY_TOKEN=m1-verify-token \
            -e MOCKWA_VERIFY_ON_START=true \
            mockwa:ci
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' mockwa-ci-m1)"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' mockwa-ci-m1)" = "healthy"

      # A third instance for the webhook model (M2): two WABAs, two apps with their own echo
      # apps and secrets, a file database on a volume so a pending retry can survive the
      # restart the checks perform, and a short retry schedule so retries are due in seconds.
      - name: Start the M2 image and its two echo apps 🧪
        run: |
          set -euo pipefail
          PORT=3003 APP_SECRET=m2-sales-secret VERIFY_TOKEN=m2-sales-verify \
            nohup node examples/echo-app/server.mjs > echo-app-m2-sales.log 2>&1 &
          PORT=3004 APP_SECRET=m2-support-secret VERIFY_TOKEN=m2-support-verify \
            nohup node examples/echo-app/server.mjs > echo-app-m2-support.log 2>&1 &
          docker volume create mockwa-ci-m2-data
          docker run -d --name mockwa-ci-m2 \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:28888:8888 -p 127.0.0.1:28025:8025 \
            -v mockwa-ci-m2-data:/data \
            -v "$PWD/e2e/fixtures/m2-seed.json:/seed/m2-seed.json:ro" \
            -e MOCKWA_DB_PATH=/data/mockwa.db \
            -e MOCKWA_SEED_FILE=/seed/m2-seed.json \
            -e MOCKWA_APPS="$(cat e2e/fixtures/m2-apps.json)" \
            -e MOCKWA_WEBHOOK_RETRY_SCHEDULE=3s \
            mockwa:ci
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' mockwa-ci-m2)"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' mockwa-ci-m2)" = "healthy"

      # A fourth instance for API fidelity (M3): Meta's default 24-hour window, the opt-in limits
      # set low enough to reach, a file database on a volume for the restart check, and an echo
      # app whose replies are the free-form sends the window judges.
      - name: Start the M3 image and its echo app 🧪
        run: |
          set -euo pipefail
          PORT=3005 APP_SECRET=m3-app-secret VERIFY_TOKEN=m3-verify-token \
            GRAPH_API_BASE_URL=http://127.0.0.1:58888/v25.0 \
            nohup node examples/echo-app/server.mjs > echo-app-m3.log 2>&1 &
          docker volume create mockwa-ci-m3-data
          docker run -d --name mockwa-ci-m3 \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:58888:8888 -p 127.0.0.1:58025:8025 \
            -v mockwa-ci-m3-data:/data \
            -e MOCKWA_DB_PATH=/data/mockwa.db \
            -e MOCKWA_WEBHOOK_URL=http://host.docker.internal:3005/webhook \
            -e MOCKWA_APP_SECRET=m3-app-secret \
            -e MOCKWA_WEBHOOK_VERIFY_TOKEN=m3-verify-token \
            -e MOCKWA_THROUGHPUT=5 \
            -e MOCKWA_PAIR_RATE_LIMIT=1m/2 \
            -e MOCKWA_MESSAGING_LIMIT=2 \
            mockwa:ci
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' mockwa-ci-m3)"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' mockwa-ci-m3)" = "healthy"

      # A fifth instance for the virtual clock and scenarios (M4): the clock stands still from a
      # fixed start, slow status rungs give a few minutes several events, a file database on a
      # volume for the restart check, and the scenario files mounted for `mockwa scenario run`.
      - name: Start the M4 image and its echo app 🧪
        run: |
          set -euo pipefail
          PORT=3006 APP_SECRET=m4-app-secret VERIFY_TOKEN=m4-verify-token \
            GRAPH_API_BASE_URL=http://127.0.0.1:59888/v25.0 \
            nohup node examples/echo-app/server.mjs > echo-app-m4.log 2>&1 &
          docker volume create mockwa-ci-m4-data
          docker run -d --name mockwa-ci-m4 \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:59888:8888 -p 127.0.0.1:59025:8025 \
            -v mockwa-ci-m4-data:/data \
            -v "$PWD/examples/scenarios:/scenarios:ro" \
            -v "$PWD/e2e/fixtures:/fixtures:ro" \
            -e MOCKWA_DB_PATH=/data/mockwa.db \
            -e MOCKWA_WEBHOOK_URL=http://host.docker.internal:3006/webhook \
            -e MOCKWA_APP_SECRET=m4-app-secret \
            -e MOCKWA_WEBHOOK_VERIFY_TOKEN=m4-verify-token \
            -e MOCKWA_CLOCK=virtual \
            -e MOCKWA_CLOCK_START=2026-06-01T08:00:00Z \
            -e MOCKWA_STATUS_DELAYS=sent:0,delivered:120000,read:240000 \
            mockwa:ci
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' mockwa-ci-m4)"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && break
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' mockwa-ci-m4)" = "healthy"

      - name: M0 smoke checks (AC-01, AC-02, signed webhooks) ✅
        run: node e2e/m0-smoke.mjs
        env:
          GRAPH_URL: http://127.0.0.1:8888
          CONSOLE_URL: http://127.0.0.1:8025
          ECHO_URL: http://127.0.0.1:3001
          APP_SECRET: ci-app-secret

      - name: M2 webhook checks (AC-06 routing, AC-07 retries and restart) ✅
        run: node e2e/m2-webhooks.mjs
        env:
          M2_GRAPH_URL: http://127.0.0.1:28888
          M2_CONSOLE_URL: http://127.0.0.1:28025
          M2_SALES_ECHO_URL: http://127.0.0.1:3003
          M2_SUPPORT_ECHO_URL: http://127.0.0.1:3004
          M2_CONTAINER: mockwa-ci-m2

      - name: M3 fidelity checks (24-hour window, limits, failure injection, restart) ✅
        run: node e2e/m3-fidelity.mjs
        env:
          M3_GRAPH_URL: http://127.0.0.1:58888
          M3_CONSOLE_URL: http://127.0.0.1:58025
          M3_ECHO_URL: http://127.0.0.1:3005
          M3_CONTAINER: mockwa-ci-m3

      - name: M4 clock and scenario checks (AC-10 timeline, AC-11 determinism, AC-12 failures, restart) ✅
        run: node e2e/m4-clock-scenarios.mjs
        env:
          M4_GRAPH_URL: http://127.0.0.1:59888
          M4_CONSOLE_URL: http://127.0.0.1:59025
          M4_ECHO_URL: http://127.0.0.1:3006
          M4_CONTAINER: mockwa-ci-m4

      - name: Playwright against the console, the virtual phone, the M2 webhook views, M3 and M4 🎭
        run: npx playwright test -c e2e/playwright.config.mjs --trace off
        env:
          GRAPH_URL: http://127.0.0.1:8888
          CONSOLE_URL: http://127.0.0.1:8025
          M1_CONSOLE_URL: http://127.0.0.1:18025
          M1_ECHO_URL: http://127.0.0.1:3002
          M1_APP_SECRET: m1-app-secret
          M2_CONSOLE_URL: http://127.0.0.1:28025
          M2_SALES_ECHO_URL: http://127.0.0.1:3003
          M3_CONSOLE_URL: http://127.0.0.1:58025
          M4_CONSOLE_URL: http://127.0.0.1:59025

      - name: Logs on failure 📜
        if: failure()
        run: |
          docker logs mockwa-ci || true
          cat echo-app.log || true
          docker logs mockwa-ci-m1 || true
          cat echo-app-m1.log || true
          docker logs mockwa-ci-m2 || true
          cat echo-app-m2-sales.log || true
          cat echo-app-m2-support.log || true
          docker logs mockwa-ci-m3 || true
          cat echo-app-m3.log || true
          docker logs mockwa-ci-m4 || true
          cat echo-app-m4.log || true

      - name: Stop the image 🧹
        if: always()
        run: |
          docker rm --force mockwa-ci mockwa-ci-m1 mockwa-ci-m2 mockwa-ci-m3 mockwa-ci-m4 || true
          docker volume rm mockwa-ci-m2-data mockwa-ci-m3-data mockwa-ci-m4-data || true

      - name: Login to GitHub Container Registry 🔑
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub 🔑
        if: env.PUBLISH == 'true' && steps.registries.outputs.dockerhub != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Publish 🚀
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: MOCKWA_VERSION=${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Full SLSA provenance and an SBOM attached to the image index — buildx would only
          # attach mode=min on its own.
          provenance: mode=max
          sbom: true

      # GitHub's own signed provenance, verifiable with `gh attestation verify` and listed on
      # the repository's Attestations tab. One subject per registry the digest was pushed to.
      - name: Attest build provenance ✅
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub) ✅
        if: env.PUBLISH == 'true' && steps.registries.outputs.dockerhub != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.registries.outputs.dockerhub }}
          subject-digest: ${{ steps.publish.outputs.digest }}
