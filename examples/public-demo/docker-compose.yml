# Public demo mode, locally: WaSandbox with WASANDBOX_MODE=public and the example echo app playing the
# app under test. Visitors open http://127.0.0.1:8025/phone; the admin signs in at
# http://127.0.0.1:8025/admin with WASANDBOX_ADMIN_TOKEN.
#
#   docker compose -f examples/public-demo/docker-compose.yml up
#
# Everything is bound to 127.0.0.1. Putting it on the internet needs a TLS reverse proxy in
# front (see README, "Public demo mode") and a token of your own; the values below are examples.

name: wasandbox-public-demo

services:
  wasandbox:
    image: ghcr.io/loongest/wasandbox:latest
    # No release is published yet, so this builds the checkout; drop it to pull the image.
    build: ../..
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8025:8025"
    environment:
      WASANDBOX_MODE: public
      # Required in public mode: at least 16 characters. Change it.
      WASANDBOX_ADMIN_TOKEN: ${WASANDBOX_ADMIN_TOKEN:-change-me-admin-token}
      # Required in public mode: only these bearer tokens reach the Graph API. The echo app
      # below replies with the same one.
      WASANDBOX_TOKENS: ${DEMO_APP_TOKEN:-demo-app-token}
      WASANDBOX_WEBHOOK_URL: http://echo-app:3001/webhook
      WASANDBOX_APP_SECRET: ${DEMO_APP_SECRET:-demo-app-secret}
      WASANDBOX_WEBHOOK_VERIFY_TOKEN: ${DEMO_VERIFY_TOKEN:-demo-verify-token}
      # Keep the demo across restarts; visitors' sessions survive one.
      WASANDBOX_DB_PATH: /data/wasandbox.db
      # The defaults, spelled out so they are easy to tune.
      WASANDBOX_PUBLIC_SESSION_TTL: 30m
      WASANDBOX_PUBLIC_MESSAGES_PER_MINUTE: "20"
      WASANDBOX_PUBLIC_MEDIA_MAX_BYTES: "1048576"
      WASANDBOX_PUBLIC_MEDIA_PER_SESSION: "10"
      WASANDBOX_PUBLIC_SESSIONS_PER_IP: "3"
    volumes:
      - public-demo-data:/data
    depends_on:
      - echo-app

  # The app under test: answers "menu" with reply buttons and echoes anything else, through
  # WaSandbox's Graph API. (Its "template" reply needs a seed with a quick-reply template, such as
  # e2e/fixtures/m1-seed.json via WASANDBOX_SEED_FILE.)
  echo-app:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../echo-app:/app:ro
    command: ["node", "server.mjs"]
    environment:
      PORT: "3001"
      APP_SECRET: ${DEMO_APP_SECRET:-demo-app-secret}
      VERIFY_TOKEN: ${DEMO_VERIFY_TOKEN:-demo-verify-token}
      ACCESS_TOKEN: ${DEMO_APP_TOKEN:-demo-app-token}
      GRAPH_API_BASE_URL: http://wasandbox:8888/v25.0

volumes:
  public-demo-data:
